<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Zyne ✨</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- Three.js and GSAP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body>

    <!-- Main Entry Screen -->
    <div id="entry-screen" class="interactive-landing">
        <div id="enter-btn" class="landing-content">
            <div class="glow-ring landing-ring"></div>
            <h1 class="entry-title new-title">🎉 Happy Birthday, Zyne! 🎂</h1>
            <p class="landing-subtitle">Click to unwrap your gift ✨</p>
        </div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="scene-container"></div>

    <!-- Main Menu UI -->
    <div id="ui-layer" style="display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0;">
        <!-- Theme Toggle Button -->
        <div class="top-nav">
            <div class="theme-toggle-container">
                <button id="themeToggle" class="glass-btn theme-btn">
                    <span class="theme-icon">🌙</span>
                    <span class="theme-text">Dark Mode</span>
                </button>
            </div>
        </div>

        <h2 class="menu-title">Your Birthday Experience</h2>
        <div id="main-menu" class="menu-grid">

            <a href="cards.html" class="menu-card glass-card">
                <div class="card-icon">💌</div>
                <div class="card-content">
                    <h3>Read Messages</h3>
                </div>
            </a>





            <a href="song.html" class="menu-card glass-card">
                <div class="card-icon">🎵</div>
                <div class="card-content">
                    <h3>Play a Song</h3>
                </div>
            </a>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
